<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" role="img" aria-label="A thread only runs from READY, and every wait leads back to READY" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="st-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="416" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#111827">A thread only runs from READY, and every wait leads back to READY</text>

  <g fill="none" stroke="#6b7280" stroke-width="1.25">
    <path d="M135 120H205" marker-end="url(#st-arrow)"/>
    <path d="M335 108H475" marker-end="url(#st-arrow)"/>
    <path d="M475 132H335" marker-end="url(#st-arrow)"/>
    <path d="M520 144V250H470" marker-end="url(#st-arrow)"/>
    <path d="M575 144V350H470" marker-end="url(#st-arrow)"/>
    <path d="M605 120H680V326" marker-end="url(#st-arrow)"/>
    <path d="M340 250H300V144" marker-end="url(#st-arrow)"/>
    <path d="M340 350H240V144" marker-end="url(#st-arrow)"/>
  </g>

  <rect x="25" y="96" width="110" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="80" y="124" text-anchor="middle" fill="#4b5563">created</text>

  <rect x="205" y="96" width="130" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="270" y="125" text-anchor="middle" font-weight="600" fill="#111827">READY</text>

  <rect x="475" y="96" width="130" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="540" y="125" text-anchor="middle" font-weight="600" fill="#111827">RUNNING</text>

  <rect x="340" y="226" width="130" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="405" y="255" text-anchor="middle" font-weight="600" fill="#111827">BLOCKED</text>

  <rect x="340" y="326" width="130" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="405" y="355" text-anchor="middle" font-weight="600" fill="#111827">SLEEPING</text>

  <rect x="595" y="326" width="130" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="660" y="355" text-anchor="middle" font-weight="600" fill="#111827">ZOMBIE</text>

  <g font-size="11.5" fill="#4b5563">
    <text x="405" y="100" text-anchor="middle">picked by scheduler</text>
    <text x="405" y="150" text-anchor="middle">slice ends or yield</text>
    <text x="512" y="200" text-anchor="end">waits on a lock</text>
    <text x="583" y="200">sys_sleep()</text>
    <text x="688" y="200">returns</text>
    <text x="308" y="200">woken</text>
    <text x="232" y="200" text-anchor="end">time is up</text>
    <text x="660" y="394" text-anchor="middle">freed by the scheduler</text>
  </g>
</svg>
